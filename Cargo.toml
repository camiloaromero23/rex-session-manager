[package]
name = "rex-session-manager"
version = "0.1.0"
edition = "2024"
description = "Project session manager for the Rex terminal multiplexer"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/camiloaromero23/rex-session-manager"
homepage = "https://github.com/camiloaromero23/rex-session-manager"
keywords = ["rex", "terminal", "multiplexer", "sessions"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
